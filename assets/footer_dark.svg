<svg xmlns="http://www.w3.org/2000/svg" width="985" height="120" viewBox="0 0 985 120" role="img" aria-label="A small ASCII robot rolling along a rail">
<title>A small ASCII robot rolling along a rail</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:14px;fill:#c9d1d9;white-space:pre}
.d{fill:#6e7681}.g{fill:#3fb950}.a{fill:#f0883e}.b{fill:#58a6ff}.r{fill:#f85149}
.k{fill:#f0883e}.h{font-weight:700}
.in{animation:in .01s steps(1) both}
.fr{opacity:0}.f0{opacity:1}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.bot{animation:roll 12s linear infinite}
@keyframes roll{from{transform:translateX(-110px)}to{transform:translateX(1005px)}}
@keyframes fr4{0%,24.990%{opacity:1}25.000%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="984" height="119" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="24" y="26" class="g">eiffis@fw:~$ </text><text x="133.2" y="26" class="d">halt  # thanks for reading, see you on the bus</text><g class="bot"><text x="18.4 26.8 35.2 43.6 52.0" y="44">.---.</text><text x="18.4 26.8 35.2 43.6 52.0" y="62" class="g">[o_o]</text><text x="18.4 26.8 35.2 43.6 52.0" y="80">'-+-'</text><text x="6.0 14.4 22.8 31.2 39.6 48.0 56.4 64.8 73.2" y="96" class="fr f0 b" style="animation:fr4 0.6s steps(1) 0.000s infinite">(|)---(|)</text><text x="6.0 14.4 22.8 31.2 39.6 48.0 56.4 64.8 73.2" y="96" class="fr b" style="animation:fr4 0.6s steps(1) 0.150s infinite">(/)---(/)</text><text x="6.0 14.4 22.8 31.2 39.6 48.0 56.4 64.8 73.2" y="96" class="fr b" style="animation:fr4 0.6s steps(1) 0.300s infinite">(-)---(-)</text><text x="6.0 14.4 22.8 31.2 39.6 48.0 56.4 64.8 73.2" y="96" class="fr b" style="animation:fr4 0.6s steps(1) 0.450s infinite">(\)---(\)</text></g><text x="6.0 14.4 22.8 31.2 39.6 48.0 56.4 64.8 73.2 81.6 90.0 98.4 106.8 115.2 123.6 132.0 140.4 148.8 157.2 165.6 174.0 182.4 190.8 199.2 207.6 216.0 224.4 232.8 241.2 249.6 258.0 266.4 274.8 283.2 291.6 300.0 308.4 316.8 325.2 333.6 342.0 350.4 358.8 367.2 375.6 384.0 392.4 400.8 409.2 417.6 426.0 434.4 442.8 451.2 459.6 468.0 476.4 484.8 493.2 501.6 510.0 518.4 526.8 535.2 543.6 552.0 560.4 568.8 577.2 585.6 594.0 602.4 610.8 619.2 627.6 636.0 644.4 652.8 661.2 669.6 678.0 686.4 694.8 703.2 711.6 720.0 728.4 736.8 745.2 753.6 762.0 770.4 778.8 787.2 795.6 804.0 812.4 820.8 829.2 837.6 846.0 854.4 862.8 871.2 879.6 888.0 896.4 904.8 913.2 921.6 930.0 938.4 946.8 955.2 963.6" y="110" class="d">===================================================================================================================</text>
